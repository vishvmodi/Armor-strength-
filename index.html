<style>

html{
scroll-behavior:smooth;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#0d0d0d;
color:white;
}

:root{
--yellow:#FFD60A;
--card:#1a1a1a;
}

/* HEADER */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 6%;
background:black;
position:sticky;
top:0;
z-index:100;
}

.logo{
font-size:22px;
font-weight:700;
color:var(--yellow);
}

nav a{
margin-left:20px;
color:white;
text-decoration:none;
font-size:15px;
}

/* HERO */

.hero{
min-height:90vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:40px 20px;

background:
linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.9)),
url("https://images.unsplash.com/photo-1554284126-aa88f22d8b74");

background-size:cover;
background-position:center;
}

.hero h1{
font-size:48px;
}

.hero p{
margin-top:10px;
color:#aaa;
}

.btn{
background:var(--yellow);
color:black;
padding:12px 26px;
display:inline-block;
margin-top:25px;
border-radius:30px;
text-decoration:none;
font-weight:600;
}

/* SECTIONS */

section{
padding:70px 6%;
}

h2{
text-align:center;
color:var(--yellow);
margin-bottom:35px;
font-size:32px;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:25px;
text-align:center;
}

.stat h3{
font-size:36px;
color:var(--yellow);
}

/* TRAINERS */

.trainers{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.trainer{
background:var(--card);
border-radius:10px;
overflow:hidden;
text-align:center;
}

.trainer img{
width:100%;
height:220px;
object-fit:cover;
}

/* TESTIMONIALS */

.testimonials{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.testimonial{
background:var(--card);
padding:20px;
border-radius:10px;
}

/* TRANSFORMATIONS */

.slider{
display:flex;
overflow-x:auto;
gap:15px;
scroll-snap-type:x mandatory;
}

.slider img{
width:280px;
border-radius:10px;
scroll-snap-align:start;
}

/* MEMBERSHIP */

.memberships{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.plan{
background:var(--card);
padding:25px;
border-radius:10px;
text-align:center;
}

.price{
font-size:32px;
color:var(--yellow);
}

/* SCHEDULE TABLE */

table{
width:100%;
border-collapse:collapse;
overflow-x:auto;
display:block;
}

td,th{
border:1px solid #333;
padding:10px;
text-align:center;
font-size:14px;
}

/* FAQ */

.faq{
background:var(--card);
padding:18px;
margin-bottom:12px;
border-radius:10px;
}

/* MAP */

.map{
width:100%;
height:320px;
border:0;
border-radius:10px;
}

/* WHATSAPP BUTTON */

.whatsapp{
position:fixed;
bottom:18px;
right:18px;
background:#25D366;
color:white;
padding:14px 18px;
border-radius:40px;
text-decoration:none;
font-weight:bold;
font-size:14px;
}

/* FOOTER */

footer{
background:black;
text-align:center;
padding:25px;
margin-top:40px;
font-size:14px;
}

/* MOBILE BREAKPOINT */

@media (max-width:768px){

nav{
display:none;
}

.hero h1{
font-size:34px;
}

section{
padding:60px 5%;
}

h2{
font-size:26px;
}

.slider img{
width:240px;
}

}

</style>
